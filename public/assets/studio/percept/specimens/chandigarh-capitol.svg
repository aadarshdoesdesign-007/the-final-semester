<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5d6e" />
      <stop offset="55%" stop-color="#8a9ba8" />
      <stop offset="100%" stop-color="#b8c5cc" />
    </linearGradient>
    <linearGradient id="concreteFacade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#55514b" />
      <stop offset="50%" stop-color="#69645c" />
      <stop offset="100%" stop-color="#504c47" />
    </linearGradient>
    <linearGradient id="finShadow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#181715" />
      <stop offset="40%" stop-color="#2a2724" />
      <stop offset="100%" stop-color="#423e39" />
    </linearGradient>
    <filter id="concreteGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.18 0" />
      <feBlend in="SourceGraphic" in2="noise" mode="multiply" />
    </filter>
  </defs>

  <!-- Sky Background with Atmospheric Haze -->
  <rect width="1200" height="800" fill="url(#skyGrad)" />

  <!-- Shivalik Foothills in distant horizon -->
  <polygon points="0,500 240,460 480,480 750,450 1020,475 1200,460 1200,530 0,530" fill="#6d7982" opacity="0.6" />

  <!-- Monolithic Concrete Roof Canopy Curve (Le Corbusier Secretariat / High Court) -->
  <path d="M 60 180 Q 600 90 1140 180 L 1140 230 L 60 230 Z" fill="#7a756d" filter="url(#concreteGrain)" stroke="#222" stroke-width="2" />
  <path d="M 50 170 Q 600 70 1150 170 L 1140 185 Q 600 95 60 185 Z" fill="#918b82" />

  <!-- Massive Concrete Portico Pylons -->
  <rect x="80" y="230" width="1040" height="340" fill="url(#concreteFacade)" filter="url(#concreteGrain)" />

  <!-- Deep Brise-Soleil Concrete Cellular Grid (Repetitive Sun-Breakers) -->
  <!-- Level 1 & 2 -->
  <g id="brise-soleil-cells">
    <!-- Grid Frame -->
    <rect x="110" y="250" width="980" height="300" fill="#242220" />
    
    <!-- Vertical Fins with angled solar shading and cast shadows -->
    <!-- 10 Modular Columns -->
    <g fill="url(#finShadow)">
      <polygon points="120,250 180,250 205,550 145,550" />
      <polygon points="220,250 280,250 305,550 245,550" />
      <polygon points="320,250 380,250 405,550 345,550" />
      <polygon points="420,250 480,250 505,550 445,550" />
      <polygon points="520,250 580,250 605,550 545,550" />
      <polygon points="620,250 680,250 705,550 645,550" />
      <polygon points="720,250 780,250 805,550 745,550" />
      <polygon points="820,250 880,250 905,550 845,550" />
      <polygon points="920,250 980,250 1005,550 945,550" />
      <polygon points="1020,250 1070,250 1085,550 1035,550" />
    </g>

    <!-- Horizontal Concrete Floor Slabs & Lintels -->
    <rect x="110" y="320" width="980" height="12" fill="#827c73" opacity="0.9" />
    <rect x="110" y="390" width="980" height="14" fill="#827c73" opacity="0.9" />
    <rect x="110" y="470" width="980" height="12" fill="#827c73" opacity="0.9" />

    <!-- Sharp 45° Concrete Fin Face Highlights -->
    <g fill="#9c958a">
      <polygon points="180,250 190,250 155,550 145,550" opacity="0.75" />
      <polygon points="280,250 290,250 255,550 245,550" opacity="0.75" />
      <polygon points="380,250 390,250 355,550 345,550" opacity="0.75" />
      <polygon points="480,250 490,250 455,550 445,550" opacity="0.75" />
      <polygon points="580,250 590,250 555,550 545,550" opacity="0.75" />
      <polygon points="680,250 690,250 655,550 645,550" opacity="0.75" />
      <polygon points="780,250 790,250 755,550 745,550" opacity="0.75" />
      <polygon points="880,250 890,250 855,550 845,550" opacity="0.75" />
      <polygon points="980,250 990,250 955,550 945,550" opacity="0.75" />
    </g>
  </g>

  <!-- Massive Board-Marked Concrete Base Plaza / Pilotis Level -->
  <rect x="0" y="570" width="1200" height="230" fill="#2d2a27" />
  <polygon points="0,570 1200,570 1200,600 0,615" fill="#3a3632" />
  
  <!-- Reflective Pool esplanade -->
  <polygon points="140,630 1060,630 1140,780 60,780" fill="#1e262c" />
  <polygon points="160,640 1040,640 1110,760 90,760" fill="#27333b" opacity="0.8" />
  <!-- Inverted Reflection of Concrete Piers in pool -->
  <g opacity="0.25" fill="#69645c">
    <rect x="200" y="640" width="40" height="90" />
    <rect x="400" y="640" width="40" height="90" />
    <rect x="600" y="640" width="40" height="90" />
    <rect x="800" y="640" width="40" height="90" />
    <rect x="960" y="640" width="40" height="90" />
  </g>

  <!-- Technical Archival Watermark Annotation -->
  <g font-family="monospace" font-size="11" fill="#D99535" letter-spacing="2">
    <text x="40" y="40">CHANDIGARH CAPITOL COMPLEX · PALACE OF ASSEMBLY (1951-1962)</text>
    <text x="40" y="60" fill="#999">LE CORBUSIER · BÉTON BRUT ARCHITECTURAL MONOGRAPH · LAT 30.7525° N</text>
  </g>
  <rect x="1110" y="30" width="50" height="20" fill="none" stroke="#D99535" stroke-width="1.5" />
  <text x="1120" y="44" font-family="monospace" font-size="10" fill="#D99535" font-weight="bold">#01</text>
</svg>
