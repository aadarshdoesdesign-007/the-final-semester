<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect width="600" height="400" fill="#141414" />
  <rect x="15" y="15" width="570" height="370" fill="none" stroke="#292929" stroke-width="1.5" />

  <!-- Modern Commercial Glass Door Frame -->
  <rect x="120" y="40" width="360" height="320" fill="#1A1A1A" stroke="#383838" stroke-width="3" />
  <!-- Glass Reflection Sheen -->
  <polygon points="130,45 230,45 150,355 130,355" fill="#FFFFFF" opacity="0.04" />
  <polygon points="260,45 360,45 180,355 150,355" fill="#FFFFFF" opacity="0.03" />

  <!-- The Classic Norman Door Contradiction: Vertical Pull Bar Installed on a "PUSH" Door -->
  <!-- Heavy Brushed Stainless Steel Vertical Grab Bar (Strong Physical "PULL" Affordance) -->
  <rect x="180" y="100" width="18" height="190" rx="9" fill="#D4D4D4" stroke="#888" stroke-width="2" filter="drop-shadow(2px 4px 6px rgba(0,0,0,0.6))" />
  <rect x="184" y="104" width="4" height="182" rx="2" fill="#FFFFFF" opacity="0.8" />
  
  <!-- Stand-off Brackets connecting bar to glass -->
  <rect x="160" y="120" width="22" height="16" fill="#A8A8A8" stroke="#555" stroke-width="1" />
  <rect x="160" y="250" width="22" height="16" fill="#A8A8A8" stroke="#555" stroke-width="1" />

  <!-- Contradictory Paper Sign: "PUSH" -->
  <rect x="230" y="160" width="160" height="70" fill="#EDEDED" stroke="#0A0A0A" stroke-width="2" />
  <text x="310" y="208" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="34" fill="#E63946" text-anchor="middle" letter-spacing="3">
    PUSH
  </text>
  <text x="310" y="222" font-family="monospace" font-size="9" fill="#555" text-anchor="middle">
    (NOT A PULL DOOR)
  </text>

  <!-- Red Conflict Callout Line -->
  <line x1="190" y1="200" x2="230" y2="200" stroke="#E63946" stroke-width="2" stroke-dasharray="3 3" />
  <circle cx="190" cy="200" r="4" fill="#E63946" />

  <!-- Cognitive Friction Annotation -->
  <g font-family="monospace" font-size="10" fill="#EDEDED">
    <text x="240" y="270" fill="#D99535" font-weight="bold">ERGONOMIC SIGNIFIER CONFLICT</text>
    <text x="240" y="286" fill="#999">Physical affordance: PULL</text>
    <text x="240" y="302" fill="#E63946">Linguistic signifier: PUSH</text>
  </g>

  <!-- Archival Header Badge -->
  <g font-family="monospace" font-size="9" fill="#D99535">
    <rect x="50" y="50" width="260" height="24" fill="#0A0A0A" stroke="#292929" stroke-width="1" />
    <text x="60" y="66" font-weight="bold">FIELD OBSERVATION #04 · NORMAN DOOR</text>
  </g>
</svg>
