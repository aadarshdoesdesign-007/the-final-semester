<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <!-- Background Archival Heavy Paper Stock -->
  <rect width="900" height="1200" fill="#EDEDED" />

  <!-- Outer Swiss Bleed Margin Line (Technical Field Manual Style) -->
  <rect x="36" y="36" width="828" height="1128" fill="none" stroke="#0A0A0A" stroke-width="1.5" />

  <!-- Top Archival Reference Bar -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0A0A0A" letter-spacing="1.5">
    <text x="56" y="80">KUNSTGEWERBEMUSEUM ZÜRICH</text>
    <text x="650" y="80" text-anchor="start">AUSSTELLUNG 1958</text>
    <line x1="56" y1="96" x2="844" y2="96" stroke="#0A0A0A" stroke-width="2" />
  </g>

  <!-- Müller-Brockmann Mathematical Radial Construct (Red Accent Dynamic Energy) -->
  <g transform="translate(450, 480)">
    <!-- Concentric Cadence Rings -->
    <circle cx="0" cy="0" r="280" fill="none" stroke="#C4C4C4" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="210" fill="none" stroke="#A8A8A8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="#888888" stroke-width="2" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#444444" stroke-width="2.5" />
    
    <!-- Dynamic Musical / Acoustic Sector in Vermilion -->
    <path d="M 0 0 L 198 -198 A 280 280 0 0 1 280 0 Z" fill="#E63946" />
    <path d="M 0 0 L 0 -210 A 210 210 0 0 1 148 -148 Z" fill="#0A0A0A" />
    <path d="M 0 0 L -99 -99 A 140 140 0 0 1 0 -140 Z" fill="#E63946" opacity="0.9" />

    <!-- Sharp Center Crosshair -->
    <line x1="-300" y1="0" x2="300" y2="0" stroke="#0A0A0A" stroke-width="1" stroke-opacity="0.2" />
    <line x1="0" y1="-300" x2="0" y2="300" stroke="#0A0A0A" stroke-width="1" stroke-opacity="0.2" />
  </g>

  <!-- Dominant Display Typography in Akzidenz-Grotesk / Helvetica Black -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" fill="#0A0A0A" letter-spacing="-2">
    <text x="56" y="870" font-size="82" line-height="0.88">INTERNATIONALE</text>
    <text x="56" y="946" font-size="82">TYPOGRAFIE</text>
  </g>

  <!-- Red Accent Baseline Bar -->
  <rect x="56" y="968" width="160" height="10" fill="#E63946" />

  <!-- Asymmetric Triple-Column Modernist Text Block -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#1C1C1C" line-height="1.4">
    <g transform="translate(56, 1010)">
      <text x="0" y="0" font-weight="700">KONSTRUKTIVE FORM</text>
      <text x="0" y="24" font-size="12" fill="#555">Ordnungssysteme für rationale</text>
      <text x="0" y="42" font-size="12" fill="#555">visuelle Kommunikation im</text>
      <text x="0" y="60" font-size="12" fill="#555">modernen Kommunikationsraum.</text>
    </g>

    <g transform="translate(330, 1010)">
      <text x="0" y="0" font-weight="700">MATHEMATISCHES RASTER</text>
      <text x="0" y="24" font-size="12" fill="#555">Anwendung modularer Teilung,</text>
      <text x="0" y="42" font-size="12" fill="#555">asymmetrischer Balance und</text>
      <text x="0" y="60" font-size="12" fill="#555">Akzidenz-Schriftschnitten.</text>
    </g>

    <g transform="translate(600, 1010)">
      <text x="0" y="0" font-weight="700">VERNISSAGE & DAUER</text>
      <text x="0" y="24" font-size="12" fill="#555">12. Mai bis 28. Juni 1958</text>
      <text x="0" y="42" font-size="12" fill="#555">Geöffnet täglich 10–18 Uhr</text>
      <text x="0" y="60" font-size="12" fill="#555">Ausstellungshalle Zürich</text>
    </g>
  </g>

  <!-- Technical Archival Annotation Baseline -->
  <g font-family="monospace" font-size="10" fill="#777">
    <line x1="56" y1="1100" x2="844" y2="1100" stroke="#0A0A0A" stroke-width="1" />
    <text x="56" y="1124">PERCEPT ARCHIVAL RECORD · SPECIMEN 14 · JOSEF MÜLLER-BROCKMANN CANON</text>
    <text x="760" y="1124" fill="#E63946" font-weight="bold">GRID: 8x8 PT</text>
  </g>
</svg>
