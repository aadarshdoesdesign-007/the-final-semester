<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <!-- Archival Dark Studio Background -->
  <rect width="800" height="1100" fill="#141414" />
  <rect x="20" y="20" width="760" height="1060" fill="none" stroke="#292929" stroke-width="1.5" />

  <!-- Technical Specimen Metadata Header -->
  <g font-family="monospace" font-size="11" fill="#888">
    <text x="50" y="60" fill="#D99535" font-weight="bold">SPECIMEN ARCHIVE · OBJECT INTELLIGENCE</text>
    <text x="50" y="80">DIETER RAMS · BRAUN AG (FRANKFURT AM MAIN, 1958)</text>
    <line x1="50" y1="96" x2="750" y2="96" stroke="#292929" stroke-width="1" />
  </g>

  <!-- Braun T3 Pocket Transistor Radio Body (Warm Grey Polystyrene) -->
  <g transform="translate(175, 170)">
    <!-- Main Shell with subtle bevel and shadow -->
    <rect x="0" y="0" width="450" height="720" rx="14" fill="#E4E3DF" stroke="#BCBBB5" stroke-width="3" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.7))" />

    <!-- Subtle Edge Highlight -->
    <rect x="6" y="6" width="438" height="708" rx="10" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />

    <!-- Braun Logotype (Classic Stengel / Wolfgang Schmittel Lettering) -->
    <g transform="translate(46, 70)">
      <!-- Distinctive Raised 'A' in BRAUN -->
      <text font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="34" fill="#1C1B1A" letter-spacing="-1">
        B<tspan dy="-6" font-size="38">R</tspan><tspan dy="6">AUN</tspan>
      </text>
    </g>

    <!-- Model Designation Right-Aligned -->
    <text x="404" y="68" font-family="monospace" font-size="14" font-weight="bold" fill="#75736E" text-anchor="end">
      T 3
    </text>

    <!-- Precision Perforated Speaker Grille (Iconic Dieter Rams matrix) -->
    <!-- 8 Rows x 8 Columns of Circular Apertures -->
    <g transform="translate(65, 120)" fill="#1A1918">
      <!-- Row 1 -->
      <circle cx="20" cy="20" r="9" /><circle cx="62" cy="20" r="9" /><circle cx="104" cy="20" r="9" /><circle cx="146" cy="20" r="9" /><circle cx="188" cy="20" r="9" /><circle cx="230" cy="20" r="9" /><circle cx="272" cy="20" r="9" /><circle cx="314" cy="20" r="9" />
      <!-- Row 2 -->
      <circle cx="20" cy="56" r="9" /><circle cx="62" cy="56" r="9" /><circle cx="104" cy="56" r="9" /><circle cx="146" cy="56" r="9" /><circle cx="188" cy="56" r="9" /><circle cx="230" cy="56" r="9" /><circle cx="272" cy="56" r="9" /><circle cx="314" cy="56" r="9" />
      <!-- Row 3 -->
      <circle cx="20" cy="92" r="9" /><circle cx="62" cy="92" r="9" /><circle cx="104" cy="92" r="9" /><circle cx="146" cy="92" r="9" /><circle cx="188" cy="92" r="9" /><circle cx="230" cy="92" r="9" /><circle cx="272" cy="92" r="9" /><circle cx="314" cy="92" r="9" />
      <!-- Row 4 -->
      <circle cx="20" cy="128" r="9" /><circle cx="62" cy="128" r="9" /><circle cx="104" cy="128" r="9" /><circle cx="146" cy="128" r="9" /><circle cx="188" cy="128" r="9" /><circle cx="230" cy="128" r="9" /><circle cx="272" cy="128" r="9" /><circle cx="314" cy="128" r="9" />
      <!-- Row 5 -->
      <circle cx="20" cy="164" r="9" /><circle cx="62" cy="164" r="9" /><circle cx="104" cy="164" r="9" /><circle cx="146" cy="164" r="9" /><circle cx="188" cy="164" r="9" /><circle cx="230" cy="164" r="9" /><circle cx="272" cy="164" r="9" /><circle cx="314" cy="164" r="9" />
      <!-- Row 6 -->
      <circle cx="20" cy="200" r="9" /><circle cx="62" cy="200" r="9" /><circle cx="104" cy="200" r="9" /><circle cx="146" cy="200" r="9" /><circle cx="188" cy="200" r="9" /><circle cx="230" cy="200" r="9" /><circle cx="272" cy="200" r="9" /><circle cx="314" cy="200" r="9" />
      <!-- Row 7 -->
      <circle cx="20" cy="236" r="9" /><circle cx="62" cy="236" r="9" /><circle cx="104" cy="236" r="9" /><circle cx="146" cy="236" r="9" /><circle cx="188" cy="236" r="9" /><circle cx="230" cy="236" r="9" /><circle cx="272" cy="236" r="9" /><circle cx="314" cy="236" r="9" />
      <!-- Row 8 -->
      <circle cx="20" cy="272" r="9" /><circle cx="62" cy="272" r="9" /><circle cx="104" cy="272" r="9" /><circle cx="146" cy="272" r="9" /><circle cx="188" cy="272" r="9" /><circle cx="230" cy="272" r="9" /><circle cx="272" cy="272" r="9" /><circle cx="314" cy="272" r="9" />
    </g>

    <!-- Large Circular Rotary Tuning Wheel (Prototypical iPod Scroll Wheel Archetype) -->
    <g transform="translate(225, 540)">
      <!-- Outer Recessed Well -->
      <circle cx="0" cy="0" r="120" fill="#D3D1CB" stroke="#BCBBB5" stroke-width="2" />
      <circle cx="0" cy="0" r="110" fill="#EAE9E5" stroke="#C8C7C1" stroke-width="2" />

      <!-- Center Turning Dimple with Frequency Calibration Scale -->
      <circle cx="0" cy="0" r="75" fill="#D9D8D2" stroke="#BCBBB5" stroke-width="1.5" />
      <circle cx="0" cy="0" r="18" fill="#BCBBB5" />

      <!-- Frequency Calibration Numbers around dial -->
      <g font-family="monospace" font-size="11" font-weight="bold" fill="#4A4944" text-anchor="middle">
        <text x="0" y="-85">100</text>
        <text x="65" y="-55">120</text>
        <text x="88" y="5">140</text>
        <text x="65" y="65">160</text>
        <text x="0" y="95">55</text>
        <text x="-65" y="65">65</text>
        <text x="-88" y="5">75</text>
        <text x="-65" y="-55">85</text>
      </g>
    </g>
  </g>

  <!-- Bottom Curatorial Footnote -->
  <g font-family="monospace" font-size="11" fill="#777" text-anchor="middle">
    <text x="400" y="990" fill="#D99535">"WENIGER, ABER BESSER" (LESS, BUT BETTER)</text>
    <text x="400" y="1015">ARCHETYPAL TRANSISTOR ARCHITECTURE · DIRECT INSPIRATION FOR APPLE IPOD (2001)</text>
  </g>
</svg>
